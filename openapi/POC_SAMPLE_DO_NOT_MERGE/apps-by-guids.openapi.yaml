openapi: 3.0.3
info:
  title: Autoscaler Binding API
  version: 1.0.0

paths:
  /v1/apps/bindings:
    get:
      summary: Returns GUIDs of apps that are bound to Autoscaler and have a policy applied
      description: |
        Takes a list of app GUIDs and returns the subset that are bound to Autoscaler and have a policy applied.

        Only returns app GUIDs where all three conditions are met:
        - App exists in the CF space
        - App is bound to Autoscaler
        - App has a policy applied

        Apps that only exist, or are bound but have no policy, are not included.
      parameters:
        - name: guids
          in: query
          required: true
          description: |
            Comma-separated list of app GUIDs to check (CF API v3 filter convention).

            ⚠️ LIMITATION: The list is sent in the URL query string, so it is bounded by
            URL/header length limits (browsers ~2 KB, nginx/Apache/Gorouter ~8 KB default).
            At ~37 chars per GUID this caps the request at roughly 50 GUIDs (browser-safe)
            to ~200 GUIDs (server default) before risking HTTP 414 URI Too Long.
            Recommended: cap at 100 GUIDs per request and batch client-side for larger sets.
          schema:
            type: array
            items:
              type: string
              format: uuid
            maxItems: 100
          style: form
          explode: false
          example: "3d6f4e2a-91bc-4f07-b3e5-7c8a2d1f0e94,a82c1b74-3e5f-4d90-8c2a-6b1e9f7d3a05"
      responses:
        '200':
          description: |
            Apps that are bound to Autoscaler and have a policy applied.
            Resources follow the CF API v3 convention, see
            https://v3-apidocs.cloudfoundry.org/version/3.236.0/index.html#list-apps
          content:
            application/json:
              schema:
                type: object
                properties:
                  resources:
                    type: array
                    items:
                      type: object
                      properties:
                        guid:
                          type: string
                          format: uuid
              example:
                resources:
                  - guid: "3d6f4e2a-91bc-4f07-b3e5-7c8a2d1f0e94"
                  - guid: "a82c1b74-3e5f-4d90-8c2a-6b1e9f7d3a05"
        '400':
          description: Invalid or missing app GUIDs
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: "Invalid app_guid format"
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: "Unauthorized: missing or invalid bearer token"
        '403':
          description: |
            Token is valid but is missing the required OAuth scope.
            Note: apps in spaces the caller has no role in are simply omitted from the
            result set (CF v3 list-endpoint behavior), not reported as an error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: "You are not authorized to perform the requested action"
