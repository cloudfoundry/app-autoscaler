---
name: Build with Postgres

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}/${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        postgres: [15, 16]
        suite: [test, integration]
    env:
      DB_DATABASE: autoscaler
      DB_USER: postgres
      DB_PASSWORD: postgres-fips-pass
    runs-on: "ubuntu-latest"
    continue-on-error: true
    name: Build suite=${{ matrix.suite }}, postgres=${{ matrix.postgres }}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-fips-pass
          POSTGRES_DB: autoscaler
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
         - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install devbox
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: true

      - name: make generate-openapi-generated-clients-and-servers
        run: |
          devbox run make generate-openapi-generated-clients-and-servers

      - name: make ${{ matrix.suite }}
        # Retries only this matrix cell's failed run (up to 3 attempts); other
        # suite/postgres combinations run in their own jobs and are not re-run.
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          DB_HOST: localhost
          CI: true
        with:
          timeout_minutes: 360
          max_attempts: 3
          retry_on: error
          command: |
            devbox run make ${{ matrix.suite }} db_type=postgres DB_HOST="${DB_HOST}" CI="${CI}"
