                  constraints:
                    nullable: false
  - changeSet:
      id: 5
      author: aqan213
      dbms: mysql
      logicalFilePath: /var/vcap/packages/scalingengine/scalingengine.db.changelog.yml
      changes:
        - createTable:
            tableName: scalinghistory
            columns:
              - column:
                  name: appid
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: timestamp
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: scalingtype
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: oldinstances
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: newinstances
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: message
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: error
                  type: varchar(255)
                  constraints:
                    nullable: true
        - addPrimaryKey:
