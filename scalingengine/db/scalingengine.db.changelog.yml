  - changeSet:
      id: 6
      author: aqan213
      dbms: mysql
      logicalFilePath: /var/vcap/packages/scalingengine/scalingengine.db.changelog.yml
      changes:
        - createTable:
            tableName: activeschedule
            columns:
              - column:
                  name: scheduleid
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: appid
                  type: varchar(250)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: createdat
                  type: timestamp
                  constraints:
                    nullable: false
                  defaultValueComputed: now()
              - column:
                  name: instancemincount
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: instancemaxcount
                  type: integer
