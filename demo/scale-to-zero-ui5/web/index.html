<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#071528">
    <meta name="description" content="Hello, AI Code Camp! A SAPUI5 demo that sleeps at zero instances and wakes on your request.">
    <title>Hello, AI Code Camp!</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230070f2'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Arial' font-weight='bold' font-size='32' fill='white'%3EAI%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://ui5.sap.com">
    <link rel="stylesheet" href="styles.css">
    <script
      id="sap-ui-bootstrap"
      src="https://ui5.sap.com/resources/sap-ui-core.js"
      data-sap-ui-theme="sap_horizon_dark"
      data-sap-ui-libs="sap.m"
      data-sap-ui-async="true"
      data-sap-ui-compat-version="edge"
      data-sap-ui-resourceroots='{"camp":"./"}'
      data-sap-ui-on-init="module:camp/App"
    ></script>
  </head>
  <body class="sapUiBody">
    <!-- Keep the greeting visible while UI5 loads, or if the CDN is unavailable. -->
    <main id="fallback" class="fallback">
      <span class="fallbackBadge">AI CODE CAMP · CLOUD FOUNDRY</span>
      <h1>Hello, AI Code Camp!</h1>
      <p class="fallbackLead">A tiny page. A big idea.</p>
      <p>This app can sleep at zero instances. One request brings it back to life.</p>
      <noscript><p>Enable JavaScript to see the SAPUI5 experience.</p></noscript>
    </main>
    <div id="ui5-root" aria-busy="true"></div>
  </body>
</html>
